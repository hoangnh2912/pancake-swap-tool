name: Build & Release

on:
  push:
    branches:
      - scan-transfer

permissions:
  contents: write

jobs:
  build-windows-scan-transfer:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack & set yarn version
        run: |
          corepack enable
          yarn --version

      - name: Bump version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content package.json -Raw
          $pkg = $content | ConvertFrom-Json
          $parts = $pkg.version -split '\.'
          $newVersion = "$($parts[0]).$($parts[1]).${{ github.run_number }}"
          # Use regex replace to avoid ConvertTo-Json mangling the file
          $content = $content -replace '"version"\s*:\s*"[^"]*"', """version"": ""$newVersion"""
          Set-Content package.json $content
          echo "version=$newVersion" >> $env:GITHUB_OUTPUT
          echo "Bumped version to $newVersion"

      - name: Install dependencies
        run: yarn install

      - name: Build & Make (Windows)
        run: yarn make
        env:
          NODE_ENV: production

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release Scan Wallet v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: out/make/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
